# Worked example: a dry run on the shipped Leaf theme (2026-10-18), made
# against https://leaf-theme-preview-olayway.flowershow.me. Not Leaf's real
# ledger. It shows the note detail and the gaps an honest ledger records.
#
# Coverage ledger for leaf/theme.css: one deliberate decision per group
# of stable theme hooks (flowershow.app/docs/reference/theme-class-reference).
# Procedure: docs/coverage-ledger.md
# Check:     scripts/coverage-ledger.py check leaf
#
#   decision: styled       theme.css has selectors for this group's hooks
#             inherits-ok  no selectors; you looked at the render and the
#                          default theme + this theme's tokens look right
#             gap          needs work; say what in the note or in gaps
#             todo         not decided yet (check fails)
#   note:     what you looked at (routes, modes) and why the decision holds
#   gaps:     optional; hook pattern -> what is still wrong
#
# Quote a value with "..." if it contains ": " or " #", or starts with a
# YAML symbol. Keys starting with * must be quoted too.

theme: leaf
groups:
  layout:
    decision: gap
    note: "Looked at /, /blog, /docs/kitchen-sink desktop+mobile, light+dark. The page is white in light mode and default near-black in dark, never Leaf's cream: --color-background is set on a bare :root, and core's :root[data-theme=light|dark] wins (palette-leaks lists it as an inactive token). Set it via --color-l-background / --color-d-background."
  navigation:
    decision: styled
    note: Olive bar, Cinzel site name, Cormorant links. Looked at / and /features/canvas light+dark, desktop and mobile shots.
    gaps:
      site-navbar-cta-button: "Near-black text on a black button: .site-navbar * sets every navbar descendant's colour, the CTA included."
      site-navbar-link: Pale link text on the olive bar in dark mode; axe flags it (contrast).
  sidebar:
    decision: inherits-ok
    note: "Site tree on / and /features/listings/grid, light+dark: Cormorant via --font-heading, default greys read well on both backgrounds."
  content:
    decision: styled
    note: Hero (full-height olive, decorative title) and page-header date restyled; body type from --font-heading. Looked at /docs/kitchen-sink, /features/hero light+dark. Callouts and code keep the default colours, which read fine but aren't Leaf's.
    gaps:
      page-header-breadcrumb*: "Default orange accent (#fb923c): Leaf never sets --color-accent."
      page-hero-cta: Primary CTA is the default orange button on the olive hero.
      page-hero-description: Grey description on olive is low contrast in dark mode.
  post:
    decision: inherits-ok
    note: "Looked at /blog/fourth-post-with-cover-and-tags light: byline, cover, caption and tag footer sit well in Leaf type. Eyebrow orange is the accent gap recorded under content; tag pills under tags."
  toc:
    decision: inherits-ok
    note: "ToC rail on /docs/kitchen-sink light+dark: default greys, current item clear."
  listings:
    decision: styled
    note: Legacy and grid cards get the green border and light-green hover; eyebrows in Cinzel. Looked at /features/listings/grid light and /blog.
    gaps:
      list-component-group-heading: Group headings are a brown (#915136) from no Leaf token (palette-leaks).
  tags:
    decision: gap
    note: "Looked at /tags dark and the post footer light: tag pills are the default pink (--color-tag-pill-* unset), off-palette for Leaf."
  changelog:
    decision: gap
    note: "Looked at /changelog light: timeline layout is fine, but the entry dots are the default orange accent (same --color-accent gap)."
  search:
    decision: gap
    note: Cannot render on the demo sites (flowershow/flowershow#1370); not reviewed.
  footer:
    decision: inherits-ok
    note: "Footer on every shot, light+dark: Cormorant headings, default greys and rule; reads as part of the page."
  page-actions:
    decision: inherits-ok
    note: "Backlinks and raw-markdown link on /docs/kitchen-sink light+dark: default greys, fine."
  embeds:
    decision: inherits-ok
    note: "Looked at /features/canvas light: node colours come from the canvas file (inline styles, palette-leaks shows them), chrome is neutral. Mermaid tooltip yellow is mermaid's own."
  errors:
    decision: inherits-ok
    note: "Looked at /this-page-does-not-exist light (not in the contact sheet): default card, Leaf type, readable."
  states:
    decision: inherits-ok
    note: State modifiers seen through their owners (hero has-image, current tree item, scrolled navbar); nothing state-specific looks off.

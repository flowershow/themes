      headings with slight h1/h2 size steps, hover-only link underlines.
      Landing repro ported and inlined self-contained.
      LLM-judged visual pass 2026-08-09: live-browsed the real code.storage
      (screenshotit's headless capture times out on it — heavy WebGL/3D
      load — so used the Chrome tool directly instead). Header chrome,
      pill-badge callouts with connector line, hero copy, and monospace
      typography all match closely. Confirmed the real hero is a genuine
      3D-rendered metallic blob (not visible on first paint — it loads in
      after a beat, which is what a first screenshot caught mid-load and
      briefly looked like a totally different icon before a second look
      showed the real render) — our flat-gradient placeholder is a
      reasonable stand-in for that, not a new gap beyond what's already in
      known_gaps below. This is an LLM screenshot comparison, not a human
      sign-off.

      2026-08-09 correction: Rufus reported the theme-applied demo (not the
      landing repro, which was already byte-verified against source) looked
      off vs. his landing page — font sizes wrong. Root cause:
      `.page-header-title`/`.page-header-description` (the page-title
      banner Flowershow renders above markdown content, separate from an
      in-markdown h1) were never styled here, so every real page (kitchen
      sink, blog index) fell back to the default theme's 48px heading —
      completely breaking the tight monospace scale outside the raw-HTML
      landing repro. material-draft already handled this class;
      monospace didn't. Fixed and republished; verified live via
      getComputedStyle (17px/600, matching the rest of the scale). This is
      exactly the kind of gap the "LLM-judged" pass above missed — it
      compared the landing page (correct) and didn't check every themed
      page against the component list.

      Also found and fixed same day: `.rendered-mdx` set font-size on the
      container but not on p/li/blockquote/table/pre individually, so
      @tailwindcss/typography's own explicit per-element font-size (18px on
      p) won regardless — fixed with :where(...) grouping + !important,
      same underlying cascade-layer-tie issue as the backtick gotcha.

      2026-08-09 architecture change: the landing page moved from a
      separate raw-HTML site (codestorage-landing-demo, deleted) to a
      `layout: plain` markdown page (landing_page above) published at
      /landing on the main demo site — one site, standard nav/footer kept,
      Tailwind typography off so hand-authored HTML+CSS has a blank
      canvas. Plain HTML (`class=`, not JSX `className=`) works fine here;
      an early draft over-assumed JSX was required from one example file
      that happened to use it. See docs/theme-authoring-tutorial.md.

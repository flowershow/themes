structural_findings:
  # L4 (component-tree / placement) gaps found while building the themes
  # above. These are core-code questions, not theme questions — logged
  # here so they don't get lost, filed as GitHub issues once triaged.
  - id: leaf-token-drift
    summary: "themes/leaf/theme.css references --color-primary / --color-primary-subtle, which don't exist in the public-site token API (dashboard-only tokens). Silently broken on live sites."
    status: filed
    issue: flowershow/flowershow#1340
  - id: navbar-height-token-unused
    summary: ".site-navbar-inner hardcodes height:4rem and never reads --navbar-height, despite the token being documented as controlling it."
    status: filed
    issue: flowershow/flowershow#1341
  - id: forced-inline-code-backticks
    summary: "@tailwindcss/typography adds literal backtick pseudo-elements to inline code, with !important, so themes need !important to remove them — contradicting docs/theming.md."
    status: filed
    issue: flowershow/flowershow#1342
  - id: blog-tsx-class-bugs
    summary: "className=\"... .is-linked\" leading dot makes the hook untargetable; Tailwind utilities leak into semantic markup; several classes emitted but never styled."
    status: filed
    issue: flowershow/flowershow#1343
  - id: raw-html-query-string-404
    summary: "Raw .html pages 404 when the URL carries any query string; Markdown pages are fine. Breaks shared links carrying utm_/fbclid params."
    status: filed
    issue: flowershow/flowershow#1345
  - id: no-content-tabs
    summary: "No tabbed-content-block component exists; mkdocs-material-style themes can't clone it."
    status: found-not-filed
  - id: no-prev-next-pagination
    summary: "No prev/next page footer pagination in page.tsx; several reference sites use it."
    status: found-not-filed
  - id: callouts-use-data-attributes
    summary: "Callouts are styled via [data-callout] / [data-callout-type] attributes, not class names; and bare attribute selectors tie the base rules at 0,1,0 so themes must scope to .rendered-mdx. Needs to be stated in the class reference."
    status: folded-into
    issue: flowershow/flowershow#1338

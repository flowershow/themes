# Ledger for the theme-authoring-pipeline loop. One entry per unit of work.
# `passes` is the ONLY source of truth for "done" — must match what
# scripts/verify.sh actually checks. Never hand-edit `passes: true` without
# the corresponding check passing; that's laundering, not progress.
#
# `fidelity` is a separate, human/LLM-judged field for "does this actually
# look like the site it clones" — it is never a gate in verify.sh and never
# implies `passes`. See CLAUDE.md "Judgement vs structure".
#
# NOTE: verify.sh does NOT write back to this file. `passes` / `checks` /
# `last_verified` are updated by hand after running it, and must reflect what
# it actually reported. If they look stale, re-run `scripts/verify.sh` and
# trust its output over this file.

version: 1
generated_by: loop-engineering audit, 2026-08-08

